[project]
name = "pharos-core"
version = "0.1.0"
description = "PHAROS shared contract - the demand record and message envelope"
requires-python = ">=3.11,<3.14"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pharos_core"]
