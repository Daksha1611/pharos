[project]
name = "pharos-sensing"
version = "0.1.0"
description = "PHAROS demand sensing - normalize, triage, dedupe, geo-resolve, trust"
requires-python = ">=3.11,<3.14"
dependencies = ["pharos-core", "numpy>=1.26", "scikit-learn>=1.5", "h3>=4.1"]

[project.optional-dependencies]
neural = ["sentence-transformers>=3.0", "torch>=2.2", "faiss-cpu>=1.8", "hdbscan>=0.8"]

[tool.uv.sources]
pharos-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pharos_sensing"]
