[project]
name = "pharos-allocator"
version = "0.1.0"
description = "PHAROS allocation engine - CP-SAT solver, zoning, cost matrix"
requires-python = ">=3.11,<3.14"
dependencies = ["pharos-core", "ortools>=9.10", "networkx>=3.2", "numpy>=1.26", "h3>=4.1"]

[tool.uv.sources]
pharos-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pharos_allocator"]
